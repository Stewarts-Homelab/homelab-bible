name: Troubleshooting request
description: Request help diagnosing a symptom
body:
  - type: markdown
    attributes:
      value: Share sanitized information only. Remove keys, passwords, private endpoints and identifying logs.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Provide the failing layer, safe checks already run, and sanitized observations.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or acceptance checks
      description: Add sanitized output or describe how success can be checked.
    validations:
      required: false
