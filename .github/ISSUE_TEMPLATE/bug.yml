name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Share sanitized information only. Remove keys, passwords, private endpoints and identifying logs.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the expected and observed behavior, versions and reproducible steps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or acceptance checks
      description: Add sanitized output or describe how success can be checked.
    validations:
      required: false
